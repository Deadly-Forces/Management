version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: claimpilot-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - claimpilot-net

  # Python ML Inference Microservice
  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: claimpilot-ml
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - MODEL_PATH=models/risk_model.pkl
      - ML_INTERNAL_KEY=${ML_INTERNAL_KEY:-claimpilot-internal-secret-2026}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - claimpilot-net

  # Node.js Express Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claimpilot-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/claimpilot}
      - JWT_SECRET=${JWT_SECRET:-claimpilot_jwt_production_secret_32chars}
      - ML_SERVICE_URL=http://ml:8001
      - ML_INTERNAL_KEY=${ML_INTERNAL_KEY:-claimpilot-internal-secret-2026}
      - DEMO_ADMIN_EMAIL=${DEMO_ADMIN_EMAIL:-admin@acme.com}
      - DEMO_ADMIN_PASSWORD=${DEMO_ADMIN_PASSWORD:-password123}
      - DEMO_VERIFIER_EMAIL=${DEMO_VERIFIER_EMAIL:-verifier@acme.com}
      - DEMO_VERIFIER_PASSWORD=${DEMO_VERIFIER_PASSWORD:-password123}
    depends_on:
      mongodb:
        condition: service_healthy
      ml:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/auth/health', (r) => process.exit(r.statusCode === 200 ? 0 : 0))"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - claimpilot-net

  # React Frontend (Nginx SPA + Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: claimpilot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - claimpilot-net

networks:
  claimpilot-net:
    driver: bridge

volumes:
  mongo_data:
  backend_uploads:
